version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: padelhive_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-padelhive}
    volumes:
      - padelhive_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-padelhive}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: padelhive_redis
    restart: unless-stopped
    volumes:
      - padelhive_redisdata:/data
    command: redis-server --appendonly yes

  api:
    image: ghcr.io/${GH_OWNER}/padelhive-api:latest
    container_name: padelhive_api
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-padelhive}?schema=public
      - REDIS_URL=redis://redis:6379

  web:
    image: ghcr.io/${GH_OWNER}/padelhive-web:latest
    container_name: padelhive_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # In production, Next.js runs in standalone mode; env vars for browser (NEXT_PUBLIC_*) 
      # are embedded at build time, so only server-side env vars are strictly needed here.

volumes:
  padelhive_pgdata:
  padelhive_redisdata: